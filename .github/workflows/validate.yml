name: Validate Flask application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application modules
        run: python -m compileall -q app.py security.py
      - name: Import Flask application
        env:
          SECRET_KEY: ci-only-test-secret
        run: python -c "import app; assert app.app"
