name: AI assistant checks

on:
  push:
    branches:
      - feature/ai-assistant
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile application modules
        run: python -m compileall -q app.py security.py ai_assistant.py student_portal.py
      - name: Run assistant authorization tests
        run: pytest -q tests
